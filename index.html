<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>
    <div id="shoulder-hazard"></div>
    <div id="vhs-overlay"></div>
    
    <div id="title-screen" class="screen">
      <h1>AUTOBAHN</h1>
      <button id="start-button">START</button>
    </div>
    
    <div id="game-over-screen" class="screen hidden">
      <h2>Spielende</h2>
      <button id="restart-button">Wiederholen</button>
    </div>
    
    <div id="permission-prompt" class="screen hidden">
      <p>This game requires motion sensors</p>
      <button id="permission-button">ENABLE MOTION</button>
    </div>
    
    <div id="no-gyro-screen" class="screen hidden">
      <h2>NO GYROSCOPE</h2>
      <p id="no-gyro-desc">Your device doesn't have motion sensors</p>
      <p class="hint">This game requires a mobile device with gyroscope</p>
      <button id="no-gyro-retry-button">Wiederholen</button>
    </div>
    
    <div id="desktop-screen" class="screen hidden">
      <h2>MOBILE ONLY</h2>
      <p>This game requires a mobile device</p>
      <p class="hint">Please open on your phone or tablet</p>
    </div>
    
    <div id="rotate-screen" class="screen overlay">
      <h1>AUTOBAHN</h1>
      <div class="rotate-content">
        <div class="phone-icon">
          <div class="phone-body"></div>
          <div class="rotate-arrow">↻</div>
        </div>
        <p>Please rotate your device</p>
      </div>
    </div>
  </div>
  
  <script type="module" src="/src/main.js"></script>
